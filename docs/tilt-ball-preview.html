<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>彈力球 · 傾斜預覽</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07080b; }
  body {
    display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  #phone {
    width: min(420px, 100%);
    height: min(860px, 100%);
    background: #0f1115;
    color: #e8eaed;
    display: flex; flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 1px #262a32;
  }
  header {
    height: 54px; flex: 0 0 54px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px; border-bottom: 1px solid #262a32;
    background: #0f1115;
  }
  header b { font-weight: 600; font-size: 15px; }
  header span { color: #7d848f; font-size: 12px; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #scroll {
    position: absolute; inset: 0;
    overflow: auto; padding: 14px 12px 18px;
  }
  .row { display: flex; margin: 0 0 10px; }
  .row.me { justify-content: flex-end; }
  .bub {
    max-width: 74%;
    padding: 8px 12px;
    border-radius: 18px;
    background: #1c2028;
    color: #e8eaed;
    font-size: 15px; line-height: 1.45;
  }
  .row.me .bub { background: #2b6cd4; color: #fff; border-bottom-right-radius: 6px; }
  .row.you .bub { border-bottom-left-radius: 6px; }
  .composer {
    height: 56px; flex: 0 0 56px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px; border-top: 1px solid #262a32;
    background: #0f1115;
  }
  .fake {
    flex: 1; height: 36px; border-radius: 18px;
    background: #171a20; color: #7d848f;
    display: flex; align-items: center; padding: 0 14px; font-size: 14px;
  }
  #layer { position: absolute; inset: 0; z-index: 3; touch-action: none; }
  .ball {
    position: absolute; left: 0; top: 0;
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #ffffe6 0 14%, #f6ff45 30%, #dcff00 62%, #a9cc00 100%);
    box-shadow: 0 0 5px 1px rgba(226, 255, 40, .75), 0 0 14px 4px rgba(214, 255, 0, .28);
    will-change: transform;
  }
  .ball i {
    position: absolute; inset: 1px; border-radius: 50%;
    border: 1.5px solid transparent;
    border-left-color: rgba(120, 150, 0, .55);
    border-right-color: rgba(120, 150, 0, .55);
    transform: scaleX(.45);
  }
  .ball-shadow {
    position: absolute; left: 0; top: 0;
    width: 14px; height: 4px; border-radius: 50%;
    background: rgba(0, 0, 0, .35);
  }
  #dock {
    position: absolute; left: 10px; right: 10px; bottom: 64px; z-index: 6;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 10px; border-radius: 14px;
    background: rgba(15, 17, 21, .82);
    border: 1px solid #262a32;
    backdrop-filter: blur(10px);
  }
  #dock button, #dock label { font: inherit; font-size: 13px; color: #e8eaed; }
  #dock button {
    border: 0; border-radius: 999px; padding: 7px 12px;
    background: #2b6cd4; color: #fff; cursor: pointer;
  }
  #dock button[hidden] { display: none; }
  #dock input[type="range"] { flex: 1; min-width: 120px; }
  #readout { color: #7d848f; font-size: 12px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="phone">
  <header><b>聊天室</b><span id="hint">左右傾斜，球會滾</span></header>
  <div id="stage">
    <div id="scroll">
      <div class="row you"><div class="bub">點空白的地方餵魚。</div></div>
      <div class="row me"><div class="bub">吃到的那隻才加飽。</div></div>
      <div class="row you"><div class="bub">球可以拖，也可以跟著手機歪。</div></div>
      <div class="row me"><div class="bub">拿平的時候它不會自己亂飄。</div></div>
    </div>
    <div id="layer">
      <div class="ball-shadow" id="shadow"></div>
      <div class="ball" id="ball"><i id="seam"></i></div>
    </div>
    <div id="dock">
      <button type="button" id="permit" hidden>開啟動作感應</button>
      <label for="tilt">模擬傾斜</label>
      <input id="tilt" type="range" min="-24" max="24" step="0.1" value="0">
      <span id="readout">0°</span>
    </div>
  </div>
  <div class="composer"><div class="fake">訊息</div></div>
</div>
<script>
const stage = document.getElementById("stage");
const ballEl = document.getElementById("ball");
const seam = document.getElementById("seam");
const shadow = document.getElementById("shadow");
const slider = document.getElementById("tilt");
const readout = document.getElementById("readout");
const permit = document.getElementById("permit");
const hint = document.getElementById("hint");
const BR = 7;
const G = 1500;
const MAXV = 1500;
const DEAD = 4 * Math.PI / 180;
const SMOOTH = 10;

const ball = { x: 0, y: 0, vx: 80, vy: 0, spin: 0, squash: 0, init: false, drag: null, samples: [] };
let sensor = 0;
let sensorOn = false;
let manual = 0;
let keys = 0;
let tilt = 0;

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function bubbles() {
  const sr = stage.getBoundingClientRect();
  const out = [];
  for (const b of document.querySelectorAll(".bub")) {
    const r = b.getBoundingClientRect();
    if (r.bottom < sr.top || r.top > sr.bottom) continue;
    out.push({
      x: r.left - sr.left, y: r.top - sr.top,
      w: r.width, h: r.height, rad: 16
    });
  }
  return out;
}
function hitBubble(s) {
  const rad = s.rad;
  const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
  const hw = s.w / 2 - rad, hh = s.h / 2 - rad;
  const dx = Math.abs(ball.x - cx) - hw, dy = Math.abs(ball.y - cy) - hh;
  const ax = Math.max(dx, 0), ay = Math.max(dy, 0);
  const sd = Math.min(Math.max(dx, dy), 0) + Math.hypot(ax, ay) - rad;
  if (sd >= BR) return;
  const sx = ball.x < cx ? -1 : 1, sy = ball.y < cy ? -1 : 1;
  let nx, ny;
  if (dx > 0 && dy > 0) {
    const l = Math.hypot(dx, dy) || 1;
    nx = sx * dx / l; ny = sy * dy / l;
  } else if (dx > dy) { nx = sx; ny = 0; }
  else { nx = 0; ny = sy; }
  ball.x += nx * (BR - sd);
  ball.y += ny * (BR - sd);
  const vn = ball.vx * nx + ball.vy * ny;
  if (vn < 0) {
    const e = -vn > 120 ? 0.8 : 0.3;
    ball.vx -= (1 + e) * vn * nx;
    ball.vy -= (1 + e) * vn * ny;
    ball.vx *= 0.98; ball.vy *= 0.98;
    if (-vn > 160) ball.squash = performance.now();
  }
}
function applyTilt(raw) {
  let a = raw;
  if (Math.abs(a) < DEAD) a = 0;
  else a = Math.sign(a) * (Math.abs(a) - DEAD);
  return clamp(a, -0.45, 0.45);
}
function wantedTilt() {
  if (keys) return applyTilt(keys);
  if (manual) return applyTilt(manual);
  if (sensorOn) return applyTilt(sensor);
  return 0;
}
function step(dt) {
  const box = stage.getBoundingClientRect();
  const W = box.width, H = box.height;
  if (!ball.init) {
    ball.init = true;
    ball.x = W * 0.5;
    ball.y = 36;
  }
  const aim = wantedTilt();
  const k = 1 - Math.exp(-SMOOTH * dt);
  tilt += (aim - tilt) * k;
  if (ball.drag) return;
  const shapes = bubbles();
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > MAXV) { ball.vx *= MAXV / sp; ball.vy *= MAXV / sp; }
  const steps = Math.max(1, Math.min(16, Math.ceil(sp * dt / (BR * 0.6))));
  const h = dt / steps;
  const ax = Math.sin(tilt) * G;
  const ay = Math.cos(tilt) * G;
  for (let i = 0; i < steps; i++) {
    ball.vx += ax * h;
    ball.vy += ay * h;
    ball.x += ball.vx * h;
    ball.y += ball.vy * h;
    if (ball.x < BR) { ball.x = BR; if (ball.vx < 0) { ball.vx = -ball.vx * 0.8; if (Math.abs(ball.vx) > 160) ball.squash = performance.now(); } }
    if (ball.x > W - BR) { ball.x = W - BR; if (ball.vx > 0) { ball.vx = -ball.vx * 0.8; if (Math.abs(ball.vx) > 160) ball.squash = performance.now(); } }
    if (ball.y < BR) { ball.y = BR; if (ball.vy < 0) ball.vy = -ball.vy * 0.75; }
    if (ball.y > H - BR) {
      ball.y = H - BR;
      if (ball.vy > 0) {
        const v = ball.vy;
        ball.vy = v > 90 ? -v * 0.72 : 0;
        ball.vx *= 0.93;
        if (v > 160) ball.squash = performance.now();
      }
    }
    for (const s of shapes) hitBubble(s);
  }
  const onFloor = ball.y >= H - BR - 0.6;
  if (onFloor && Math.abs(ball.vy) < 8) {
    ball.vy = 0;
    const drive = Math.sin(tilt) * G;
    if (Math.abs(drive) < 40) ball.vx *= Math.pow(0.35, dt);
    if (Math.abs(ball.vx) < 4 && Math.abs(drive) < 40) ball.vx = 0;
  }
  ball.spin += ball.vx * dt / BR;
}
function paint(now) {
  const sq = now - ball.squash < 90 ? " scale(1.18,0.82)" : "";
  ballEl.style.transform = "translate3d(" + (ball.x - BR).toFixed(2) + "px," + (ball.y - BR).toFixed(2) + "px,0)" + sq;
  seam.style.transform = "rotate(" + (ball.spin * 57.3).toFixed(1) + "deg) scaleX(.45)";
  const h = Math.max(0, (stage.clientHeight - BR) - ball.y);
  const sc = Math.max(0.25, Math.min(1, 1 - h / 220));
  shadow.style.transform = "translate3d(" + (ball.x - BR).toFixed(2) + "px," + (stage.clientHeight - 6).toFixed(2) + "px,0) scale(" + sc.toFixed(2) + ")";
  shadow.style.opacity = String(sc);
  const deg = (tilt * 180 / Math.PI);
  readout.textContent = (deg >= 0 ? "+" : "") + deg.toFixed(1) + "°";
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.032, (now - last) / 1000);
  last = now;
  step(dt);
  paint(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function localPoint(e) {
  const r = stage.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
stage.addEventListener("pointerdown", (e) => {
  const p = localPoint(e);
  if (Math.hypot(p.x - ball.x, p.y - ball.y) > BR + 16) return;
  ball.drag = e.pointerId;
  ball.vx = ball.vy = 0;
  ball.samples = [{ t: performance.now(), x: p.x, y: p.y }];
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", (e) => {
  if (ball.drag !== e.pointerId) return;
  const p = localPoint(e);
  const now = performance.now();
  ball.x = clamp(p.x, BR, stage.clientWidth - BR);
  ball.y = clamp(p.y, BR, stage.clientHeight - BR);
  ball.samples.push({ t: now, x: ball.x, y: ball.y });
  while (ball.samples.length > 2 && now - ball.samples[0].t > 90) ball.samples.shift();
});
function release(e) {
  if (ball.drag !== e.pointerId) return;
  const s = ball.samples;
  let vx = 0, vy = 0;
  if (s.length >= 2) {
    const a = s[0], b = s[s.length - 1];
    const t = Math.max(16, b.t - a.t) / 1000;
    vx = (b.x - a.x) / t; vy = (b.y - a.y) / t;
  }
  const sp = Math.hypot(vx, vy);
  if (sp > MAXV) { vx *= MAXV / sp; vy *= MAXV / sp; }
  ball.vx = vx; ball.vy = vy;
  ball.drag = null;
}
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);

function onOrient(e) {
  if (typeof e.gamma !== "number" || Number.isNaN(e.gamma)) return;
  sensorOn = true;
  const g = e.gamma;
  sensor += (g * Math.PI / 180 - sensor) * 0.35;
  hint.textContent = "感應器已接上";
}
function armSensor() {
  window.addEventListener("deviceorientation", onOrient);
}
if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
  permit.hidden = false;
  permit.addEventListener("click", () => {
    DeviceOrientationEvent.requestPermission().then((state) => {
      if (state === "granted") { permit.hidden = true; armSensor(); }
      else hint.textContent = "沒有開感應，可用滑桿";
    }).catch(() => { hint.textContent = "沒有開感應，可用滑桿"; });
  });
} else if (window.DeviceOrientationEvent) {
  armSensor();
}

slider.addEventListener("input", () => { manual = Number(slider.value) * Math.PI / 180; });
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") keys = -18 * Math.PI / 180;
  if (e.key === "ArrowRight") keys = 18 * Math.PI / 180;
});
window.addEventListener("keyup", (e) => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") keys = 0;
});
</script>
</body>
</html>
